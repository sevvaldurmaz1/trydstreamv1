spring:
  application:
    name: vesaik-kontrol-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ── Database ──────────────────────────────────────────────────
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/traydstream}
    username: ${SPRING_DATASOURCE_USERNAME:traydstream}
    password: ${SPRING_DATASOURCE_PASSWORD:traydstream_secret}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
    show-sql: false

  # ── Flyway ────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Redis ─────────────────────────────────────────────────────
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:redis_secret}
      timeout: 2000ms

  # ── File Upload ───────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

# ── Server ────────────────────────────────────────────────────────
server:
  port: ${BACKEND_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/plain
  error:
    include-message: always
    include-binding-errors: always

# ── JWT ───────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:traydstream_jwt_super_secret_key_must_be_at_least_256_bits_long_for_hs256}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

# ── App Config ────────────────────────────────────────────────────
app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  ai-service-url: ${AI_SERVICE_URL:http://localhost:8000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ── Actuator ──────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ── Logging ───────────────────────────────────────────────────────
logging:
  level:
    com.traydstream: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
