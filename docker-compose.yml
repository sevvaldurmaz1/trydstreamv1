# ─────────────────────────────────────────────────────────────────
# Traydstream – Docker Compose (Development)
# ─────────────────────────────────────────────────────────────────

networks:
  traydstream-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  uploads-data:

services:

  # ── PostgreSQL ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: traydstream-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-traydstream}
      POSTGRES_USER: ${POSTGRES_USER:-traydstream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traydstream_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - traydstream-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-traydstream} -d ${POSTGRES_DB:-traydstream}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: traydstream-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - traydstream-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend – Spring Boot ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: traydstream-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-traydstream}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-traydstream}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-traydstream_secret}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      UPLOAD_DIR: /app/uploads
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - uploads-data:/app/uploads
    networks:
      - traydstream-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── AI Service – FastAPI ─────────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: traydstream-ai
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-traydstream}:${POSTGRES_PASSWORD:-traydstream_secret}@postgres:5432/${POSTGRES_DB:-traydstream}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      UPLOAD_DIR: /app/uploads
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    volumes:
      - uploads-data:/app/uploads
    networks:
      - traydstream-net
    depends_on:
      postgres:
        condition: service_healthy

  # ── Frontend – Vite Dev Server ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: traydstream-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api/v1
      VITE_AI_SERVICE_URL: http://localhost:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - traydstream-net
    depends_on:
      - backend
